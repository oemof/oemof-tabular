[tool.black]
exclude = '''
/(
    \
  |
    \.eggs
  | \.git
  | \.mypy_cache
  | meta/migrations
  | docs
  | .venv
  | venv
  | .ipynb
  | \.direnv
  | \.hg
  | \.mypy_cache
  | \.nox
  | \.tox
  \.svn
  | _build
  | buck-out
  | build
  | dist
  | docs
)/
'''
line-length=79

[tool.isort]
profile = "black"
forced_separate = ["conftest"]
force_single_line = true

[tool.ruff]
extend-exclude = ["static", "ci/templates"]
line-length = 79
src = ["src", "tests"]
target-version = "py313"
